# --- 3. GEOJSON LAYERS -------------------------------------------------------
#  Points, lines or polygons — basin boundaries, command areas, station
#  networks, districts, anything.
#
#  TO ADD ONE:
#    1. Put the .geojson file in  assets/geo/
#    2. Add a block below.
#    3. That is all. A layer switcher appears automatically when there is more
#       than one layer.
#
#  Fields:
#    name          Shown in the layer switcher. Required.
#    file          Path from the site root. Required.
#    colour        Line colour, and fill colour for polygons.
#    fill_opacity  0 to 1. Use 0 for outline-only polygons.
#    weight        Line thickness in pixels.
#    point_radius  Size of point markers, if the file contains points.
#    label_field   Property name to use as the marker tooltip / popup heading.
#    popup_fields  Properties to list in the popup. Omit to show all of them.
#    show          false = present in the switcher but off when the page loads.
#
#  Keep files under about 1 MB. Simplify geometry first if a boundary file is
#  large — mapshaper.org does this in the browser, no install.
#
#  Two demonstration files ship with the site. They are NOT programme data.
#  Uncomment a block to see how a layer behaves, then replace it with yours.
layers:
  - name: "Countries"
    file: assets/geo/countryboundaries.min.geojson
    colour: "#8a4b1e"
    fill_opacity: 0.15
    weight: 1.5
    label_field: NAM_0
    popup_fields: [NAM_0]
    show: true

