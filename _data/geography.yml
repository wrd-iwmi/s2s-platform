# =============================================================================
#  COUNTRY MARKERS ON THE HOMEPAGE MAP
#
#  This drives a real OpenStreetMap map. To add a country, copy a block and
#  change the values. To find lat/lon: open https://www.openstreetmap.org,
#  right-click the spot, choose "Show address" and read the numbers, or just
#  search the place name and read them from the address bar.
#
#  lat  = latitude,  positive north of the equator, negative south
#  lon  = longitude, positive east of Greenwich, negative west
#
#  Nothing else on the site needs changing when you add a country.
# =============================================================================

# --- Map behaviour -----------------------------------------------------------
settings:
  # Where the map sits when the page loads. These defaults frame Africa and
  # South/Southeast Asia together.
  centre_lat: 12
  centre_lon: 45
  zoom: 3
  # Height of the map in pixels.
  height: 420
  # true  = the map is a real interactive OpenStreetMap
  # false = fall back to the lightweight schematic drawing (no map library)
  interactive: true

# --- Countries ---------------------------------------------------------------
countries:
