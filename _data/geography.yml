# =============================================================================
#  THE MAP ON THE HOMEPAGE
#
#  Three things live here:
#    1. settings  — size and behaviour of the map
#    2. countries — the pin markers
#    3. layers    — optional GeoJSON files (points, lines or polygons)
#
#  To find a latitude and longitude: open https://www.openstreetmap.org, search
#  the place, and read the numbers from the address bar — or right-click the
#  spot and choose "Show address".
#
#  lat = latitude,  positive north of the equator, negative south
#  lon = longitude, positive east of Greenwich, negative west
# =============================================================================

# --- 1. MAP SETTINGS ---------------------------------------------------------
settings:
  # Where the map sits when it loads, if fit_to_data is false.
  centre_lat: 12
  centre_lon: 45
  zoom: 3

  # Height in pixels. Keep it modest — the country list beside the map carries
  # the same information, and a tall map pushes the rest of the page down.
  height: 340
  height_mobile: 260

  # true  = zoom automatically so everything (markers and any layers) is visible
  # false = use centre_lat / centre_lon / zoom above
  fit_to_data: true

  # true  = a real OpenStreetMap map
  # false = the lightweight schematic drawing, no map library, works offline
  interactive: true

