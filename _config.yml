# =============================================================================
#  SITE SETTINGS
#
#  This is the only settings file. Everything below can be edited safely.
#  After you save a change here, GitHub rebuilds the site in about a minute.
#
#  IMPORTANT: changes to THIS file only take effect after a rebuild. If you are
#  previewing locally you must stop and restart the server.
# =============================================================================

# -----------------------------------------------------------------------------
#  1. WHERE THE SITE LIVES  ←  the one thing you must set before publishing
# -----------------------------------------------------------------------------
# Live address:  https://wrd-iwmi.github.io/s2s-platform/
#
# If you ever rename the repository or move to a custom domain, these two lines
# are the only thing that has to change:
#   https://ORG.github.io/REPO/   →  baseurl: "/REPO"     url: "https://ORG.github.io"
#   https://ORG.github.io/        →  baseurl: ""          url: "https://ORG.github.io"
#   https://your.domain/          →  baseurl: ""          url: "https://your.domain"
baseurl: "/s2s-platform"
url: "https://wrd-iwmi.github.io"

# -----------------------------------------------------------------------------
#  2. NAMES AND CONTACT — shown in the header, footer and page titles
# -----------------------------------------------------------------------------
title: "CGIAR Climate Action — S2S Platform"
short_name: "S2S Platform"
# The header title, one line per entry. Spacing between lines is identical, so
# add or remove a line without anything else needing adjustment.
brand_lines:
  - "CGIAR Climate Action"
  - "Seasonal to Subseasonal"
brand_line_2: "Knowledge Hub"
lead_institute: "International Water Management Institute (IWMI)"
programme: "CGIAR Climate Action"
contact_email: "wrd@iwmi.org"
repo_url: "https://github.com/wrd-iwmi/s2s-platform"

# Needed only for the "Run in Colab" and "View on nbviewer" buttons on notebook
# tutorials. Format: ORG/REPO. Leave empty to hide those buttons.
colab_repo: "wrd-iwmi/s2s-platform"
colab_branch: "main"

# -----------------------------------------------------------------------------
#  LOGOS shown at the right of the header
#
#  To swap a logo: put the new file in assets/img/ and change the "file" line.
#  To add one: copy a block. To remove one: delete its block.
#  Use SVG where you have it, otherwise a PNG about 400 px wide.
#  Order here is the order left-to-right on the page.
# -----------------------------------------------------------------------------
logos:
  - file: /assets/img/iwmi.png
    alt: "International Water Management Institute"
    url: "https://www.iwmi.cgiar.org/"
  - file: /assets/img/cgiar-climate-action.png
    alt: "CGIAR Climate Action"
    url: "https://www.cgiar.org/"

# -----------------------------------------------------------------------------
#  ANALYTICS
#  GA4 measurement ID, format G-XXXXXXXXXX. Leave empty to switch tracking off
#  entirely — no script is loaded and no cookie is set.
# -----------------------------------------------------------------------------
google_analytics: "G-NQSWBCK6QN"

description: >-
  Technical platform of the IWMI-led CGIAR Climate Action work on
  seasonal-to-subseasonal (S2S) forecasting: forecast datasets, downscaling
  methods, interoperability APIs, tutorials and advisory pilots for agriculture,
  water management and early action.

# Shown in the footer so readers know how current the site is.
documentation_status: >-
  Under active development — content is being added deliverable by deliverable.

# -----------------------------------------------------------------------------
#  3. COLLECTIONS — the six kinds of page on this site
#
#  Each one maps to a folder. To add a tool, put a .md file in _tools/.
#  You should not need to change anything in this section.
# -----------------------------------------------------------------------------
collections:
  tools:
    output: true
    permalink: /tools/:name/
    label: "Tool"
  methods:
    output: true
    permalink: /methods/:name/
    label: "Method"
  apis:
    output: true
    permalink: /apis/:name/
    label: "API"
  tutorials:
    output: true
    permalink: /tutorials/:name/
    label: "Tutorial"
  case_studies:
    output: true
    permalink: /case-studies/:name/
    label: "Case study"
  datasets:
    output: true
    permalink: /datasets/:name/
    label: "Dataset"

# Default values, so you never have to repeat them in a page's front matter.
defaults:
  - scope: { path: "", type: "tools" }
    values: { layout: "tool",       status: "Documentation pending", weight: 0 }
  - scope: { path: "", type: "methods" }
    values: { layout: "method",     status: "Documentation pending", weight: 0 }
  - scope: { path: "", type: "apis" }
    values: { layout: "api",        status: "Documentation pending", weight: 0, version: "Unreleased" }
  - scope: { path: "", type: "tutorials" }
    values: { layout: "tutorial",   status: "Planned",               weight: 0 }
  - scope: { path: "", type: "case_studies" }
    values: { layout: "case-study", status: "Pilot",                 weight: 0 }
  - scope: { path: "", type: "datasets" }
    values: { layout: "dataset",    status: "Operational",           weight: 0 }

# -----------------------------------------------------------------------------
#  4. BUILD SETTINGS — leave these alone
# -----------------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge

# No plugins. Everything (sitemap, SEO tags, robots.txt) is generated by the
# site's own templates, so the build cannot break when a plugin changes.
plugins: []

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - EDITING-GUIDE.md
  - SETUP-GITHUB-PAGES.md
  - ANALYTICS.md
  - _templates
  - intake-forms
  - .nojekyll.note
  - .jekyll-cache

# Publish the notebooks folder so the "Download .ipynb" buttons work.
include:
  - notebooks

# Pretty URLs: /tools/aware/ rather than /tools/aware.html
permalink: pretty
